    color: var(--amber);
    font-size: 1.6rem;

    font-size: 0.68rem;

    font-size: 0.88rem;

    border-radius: 12px;
    padding: 1rem 1.2rem;
    margin-bottom: 1.2rem;
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .config-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 0.75rem;
  }

  .config-label {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    min-width: 90px;
  }

  .quiz-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--muted);
    margin-bottom: 1rem;
  }

  .quiz-meta .score { color: var(--amber); font-weight: 600; }

  .quiz-card {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.3rem;
  }

  .quiz-question {
    color: var(--paper);
    font-size: 1.05rem;
    font-weight: 600;
    line-height: 1.5;
    margin: 0 0 1.2rem;
  }

  .option {
    display: block;
    width: 100%;
    text-align: left;
    font-family: var(--mono);
    font-size: 0.88rem;
    color: var(--paper);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.6rem;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .option:hover:not([disabled]) {
    border-color: var(--amber);
    background: #212F43;
  }

  .option.correct { color: var(--sage); background: #7FB77E22; border-color: var(--sage); }
  .option.wrong { color: var(--coral); background: #D9695F22; border-color: var(--coral); }

  .explanation {
    color: var(--paper);
    font-size: 0.88rem;
    line-height: 1.5;
    background: #0C1117;
    border: 1px solid var(--border);
    border-left: 4px solid var(--amber);
    border-radius: 8px;
    padding: 0.8rem 1rem;
    margin-top: 1.1rem;
  }

  .next-btn, .restart-btn, .primary-btn {
    font-family: var(--mono);
    font-weight: 600;
    font-size: 0.88rem;
    color: var(--bg);
    background: var(--amber);
    border: none;
    border-radius: 8px;
    padding: 0.65rem 1.25rem;
    margin-top: 1rem;
    cursor: pointer;
    transition: opacity 0.15s ease;
  }
  .next-btn:hover, .restart-btn:hover, .primary-btn:hover { opacity: 0.9; }

  .result { text-align: center; padding: 2.2rem 1rem; }
  .result .label { font-family: var(--mono); color: var(--amber); font-size: 0.8rem; letter-spacing: 0.1em; }
  .result .score-big { color: var(--paper); font-size: 2.4rem; font-weight: 700; margin: 0.5rem 0; }
  .result .msg { color: var(--muted); font-size: 0.95rem; max-width: 440px; margin: 0 auto 1.5rem; }

  /* Practice Tab */
  .lab-layout { display: flex; flex-direction: column; gap: 1.5rem; }

  .drill-card {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 1rem;
  }

  .drill-header { display: flex; justify-content: space-between; align-items: center; }
  .drill-header h3 { margin: 0; font-size: 1.05rem; }

  .input-area { display: flex; flex-direction: column; gap: 0.6rem; }

  textarea.code-input, input.code-input {
    width: 100%;
    font-family: var(--mono);
    font-size: 0.9rem;
    color: var(--paper);
    background: #0C1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 0.9rem;
    outline: none;
  }

  textarea.code-input:focus, input.code-input:focus { border-color: var(--amber); }

  .feedback {
    font-family: var(--mono);
    font-size: 0.82rem;
    padding: 0.6rem 0.8rem;
    border-radius: 6px;
    display: none;
  }
  .feedback.success { display: block; background: #7FB77E22; color: var(--sage); border: 1px solid var(--sage); }
  .feedback.error { display: block; background: #D9695F22; color: var(--coral); border: 1px solid var(--coral); }

  .sandbox-card {
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }

  .console-out {
    font-family: var(--mono);
    font-size: 0.85rem;
    background: #080B0F;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.8rem;
    min-height: 100px;
    max-height: 220px;
    overflow-y: auto;
    color: var(--teal);
    white-space: pre-wrap;
    margin-top: 0.8rem;
  }
</style>

<script>

  {
    id: "str_trans", cat: "Strings & Methods", num: "STR·01", title: "translate() & maketrans()",
    code: `# 1. Create a character translation mapping table\ntable = str.maketrans("aeiou", "12345")\n\n# 2. Apply table to string\ntext = "hello world"\nclean = text.translate(table)\nprint(clean)  # "h2ll4 w4rld"`,
    blueprint: "table = str.maketrans(from_chars, to_chars)\nnew_text = string.translate(table)",
    pitfall: "from_chars and to_chars MUST have the exact same character length, or Python throws a ValueError.",
    note: "Replaces or removes multiple characters simultaneously in a single high-speed pass."
  },
  {
    id: "str_del", cat: "Strings & Methods", num: "STR·02", title: "Deleting characters with translate()",
    code: `import string\n\ntext = "Hello, World! How's it going?"\n# Third parameter deletes specified characters\nremove_punct = str.maketrans("", "", string.punctuation)\nprint(text.translate(remove_punct))\n# Output: "Hello World Hows it going"`,
    blueprint: "str.maketrans(\"\", \"\", chars_to_delete)",
    pitfall: "Forgetting to pass empty strings as the first two arguments will result in incorrect argument positioning.",
    note: "The 3rd argument of maketrans() specifies characters to completely strip out of the string."
  },
  {
    id: "str_split", cat: "Strings & Methods", num: "STR·03", title: "split() and join()",
    code: `words = "python,is,awesome".split(",") # ['python', 'is', 'awesome']\ntext = " ".join(words)               # "python is awesome"`,
    blueprint: "list_var = string.split(delimiter)\nstring_var = delimiter.join(list_var)",
    pitfall: "join() requires a list containing ONLY strings. If integers are inside, use a list comprehension first.",
    note: "split() breaks text into a list; join() glues list items back into a single string."
  },
  {
    id: "f1", cat: "Functions", num: "FUNC·01", title: "def statement & return",
    code: `def multiply(a, b):\n    return a * b\n\nresult = multiply(4, 5)`,
    blueprint: "def function_name(param1, param2):\n    return output_value",
    pitfall: "Code written directly underneath a 'return' statement inside a function will never execute.",
    note: "def creates a function; 'return' sends the output value back to the caller."
  }
];

const CATEGORIES = ["All", ...new Set(LIBRARY.map(i => i.cat))];

const CORE_FIVE = [
  { n: "1", title: "Variables & Data Types", desc: "Every program starts by holding on to values — names, numbers, on/off states.", code: `name = "Seth"     # str\nage = 21          # int`, why: "Nothing else in a program works until something exists to work on." },
  { n: "2", title: "Conditionals", desc: "if / elif / else let a program make a decision.", code: `if ticket_count > 0:\n    print("Show's on")`, why: "Decisions are what separate a script from a straight line of instructions." }
];

const QUESTION_POOL = [
  { id: 1, cat: "Strings & Methods", level: "Intermediate", q: "What is the primary function of str.maketrans() when used with .translate()?", options: ["It converts strings into integers", "It creates a translation table mapping characters to replacement characters", "It translates text between human languages"], answer: 1, exp: "str.maketrans() creates a 1-to-1 character translation dictionary used by string.translate()." }
];

const PRACTICE_DRILLS = [
  {
    title: "String Translation (.translate)",
    instruction: "Use `str.maketrans` and `.translate()` to replace all 'a' characters with 'x' in the variable `text`.",
    hint: "table = str.maketrans('a', 'x')\nprint(text.translate(table))",
    validate: (val) => val.includes("maketrans") && val.includes("translate"),
    template: "text = \"cat hat bat\"\n# Create translation table and print translated string below:\n"
  }
];

// State Management
let state = {
  tab: "lookup", // Set lookup as default view
  lookupQuery: "translate",
  filter: "All",
  
  // Quiz
  quizSubject: "All",
  quizLevel: "All",
  activeQuestions: [],
  quizIndex: 0,
  quizSelected: null,
  quizScore: 0,
  quizDone: false,

  // Practice
  activeDrillIdx: 0,
  sandboxInput: "text = 'hello world'\ntable = str.maketrans('el', '13')\nprint(text.translate(table))",
  sandboxOutput: ""
};

function esc(str) {
  return (str || '').replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderTabs() {
  const tabs = [
    { id: "lookup", label: "What code is this?" },
    { id: "glossary", label: "Beginner Glossary" },
    { id: "library", label: "Syntax Reference" },
    { id: "core5", label: "Core 5 Concepts" },
    { id: "quiz", label: "Quiz Engine" },
    { id: "practice", label: "Practice Lab" }
  ];
  const el = document.getElementById("tabs");
  el.innerHTML = tabs.map(t =>
    `<button class="tab-btn ${state.tab === t.id ? "active" : ""}" data-tab="${t.id}">${t.label}</button>`
  ).join("");
  
  el.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      state.tab = btn.dataset.tab;
      render();
    });
  });
}

// VIEW 0: "What code is this?" - Command Lookup Input
function findCommand(query) {
  if (!query) return null;
  const clean = query.trim().toLowerCase().replace(/[()]/g, '');
  
  return COMMAND_DATABASE.find(item => {
    if (item.cmd.toLowerCase() === clean) return true;
    return item.aliases.some(a => a.toLowerCase().replace(/[()]/g, '') === clean);
  }) || COMMAND_DATABASE.find(item => item.cmd.toLowerCase().includes(clean) || clean.includes(item.cmd.toLowerCase()));
}

function renderLookup() {
  const match = findCommand(state.lookupQuery);
  const quickChips = COMMAND_DATABASE.slice(0, 8).map(item => 
    `<span class="quick-chip" data-cmd="${item.cmd}">${item.cmd}</span>`
  ).join("");

  let resultCard = `
    <div class="lookup-result" style="text-align: center; padding: 3rem 1rem;">
      <p style="color: var(--muted); margin: 0; font-size: 1rem;">Type a command, method, or keyword above (e.g., <code>def</code>, <code>translate</code>, <code>append</code>, <code>split</code>) to look up its definition and function.</p>
    </div>
  `;

  if (match) {
    resultCard = `
      <div class="lookup-result">
        <div class="result-header">
          <span class="result-cmd">${esc(match.cmd)}</span>
          <span class="badge badge-amber">${esc(match.type)}</span>
        </div>
        <div class="detail-section">
          <span class="detail-label">1. Definition</span>
          <div class="detail-val">${esc(match.definition)}</div>
        </div>
        <div class="detail-section">
          <span class="detail-label">2. Function (How it works)</span>
          <div class="detail-val">${esc(match.function)}</div>
        </div>
        <div class="detail-section">
          <span class="detail-label">3. Purpose (When to use it)</span>
          <div class="detail-val">${esc(match.purpose)}</div>
        </div>
        <div class="detail-section" style="margin-top: 0.4rem;">
          <span class="detail-label">Syntax Example</span>
          <pre class="code">${esc(match.example)}</pre>
        </div>
      </div>
    `;
  }

  return `
    <div class="lookup-box">
      <h3 style="margin: 0; color: var(--amber);">What code is this?</h3>
      <p style="color: var(--muted); font-size: 0.88rem; margin: 0;">Enter a specific Python keyword, method, or command to see what it means and how it works:</p>
      
      <div class="search-input-wrap">
        <input type="text" id="command-search" class="search-input" placeholder="Enter command (e.g. translate, def, split, range)..." value="${esc(state.lookupQuery)}" autocomplete="off" spellcheck="false" />
      </div>

      <div class="quick-chips">
        <span style="font-size: 0.75rem; color: var(--muted); margin-right: 0.3rem;">Quick Try:</span>
        ${quickChips}
      </div>
    </div>
    ${resultCard}
  `;
}

// View 1: Glossary
function renderGlossary() {
  const rows = GLOSSARY.map(g => `
    <tr>
      <td class="term">${g.term}</td>
      <td><strong>${g.name}</strong></td>
      <td>${g.def}</td>
      <td style="color: var(--muted);">${g.analogy}</td>
    </tr>
  `).join("");

  return `
    <h3 style="margin-top:0; color:var(--amber);">Python Keyword & Concept Glossary</h3>
    <table class="glossary-table">
      <thead>
        <tr><th>Keyword</th><th>Full Name</th><th>What It Does</th><th>Real-World Analogy</th></tr>
      </thead>
      <tbody>${rows}</tbody>
    </table>
  `;
}

// View 2: Reference Library
function renderLibrary() {
  const items = state.filter === "All" ? LIBRARY : LIBRARY.filter(i => i.cat === state.filter);
  const filters = CATEGORIES.map(cat =>
    `<button class="filter-chip ${state.filter === cat ? "active" : ""}" data-cat="${cat}">${cat.toUpperCase()}</button>`
  ).join("");

  const cards = items.map(item => `
    <div class="card">
      <div class="card-head">
        <h3>${esc(item.title)}</h3>
        <span class="badge badge-amber">${item.num}</span>
      </div>
      <pre class="code">${esc(item.code)}</pre>
      <div class="blueprint-box"><strong>SYNTAX BLUEPRINT:</strong><br><code>${esc(item.blueprint)}</code></div>
      <p style="margin:0; font-size:0.85rem; color:var(--muted);">${esc(item.note)}</p>
    </div>
  `).join("");

  return `
    <div class="filters">${filters}</div>
    <div class="card-grid">${cards}</div>
  `;
}

// View 3: Core 5
function renderCoreFive() {
  return CORE_FIVE.map(b => `
    <div class="block">
      <div class="block-head">
        <div class="block-num">${b.n}</div>
        <div>
          <h3>${esc(b.title)}</h3>
          <p>${esc(b.desc)}</p>
        </div>
      </div>
      <pre class="code">${esc(b.code)}</pre>
    </div>
  `).join("");
}

// View 4: Quiz
function renderQuiz() {
  const question = QUESTION_POOL[0];
  return `
    <div class="quiz-card">
      <p class="quiz-question">${esc(question.q)}</p>
      <div>${question.options.map(opt => `<button class="option">${esc(opt)}</button>`).join("")}</div>
    </div>
  `;
}

// View 5: Practice Lab
function renderPractice() {
  return `
    <div class="sandbox-card">
      <h3>Interactive Console Sandbox</h3>
      <textarea id="sandbox-input" class="code-input" rows="5">${esc(state.sandboxInput)}</textarea>
      <button class="primary-btn" id="run-sandbox-btn" style="margin-top: 0.8rem;">Run Code &rarr;</button>
      <div class="console-out">${esc(state.sandboxOutput || "> Console output will appear here...")}</div>
    </div>
  `;
}

// Master Render Loop
function render() {
  renderTabs();
  const panel = document.getElementById("panel");

  if (state.tab === "lookup") {
    panel.innerHTML = renderLookup();
    const searchInput = document.getElementById("command-search");
    if (searchInput) {
      searchInput.focus();
      searchInput.addEventListener("input", (e) => {
        state.lookupQuery = e.target.value;
        const match = findCommand(state.lookupQuery);
        // Live update result without re-rendering tabs
        const existingCard = panel.querySelector(".lookup-result");
        if (existingCard) {
          if (match) {
            existingCard.innerHTML = `
              <div class="result-header">
                <span class="result-cmd">${esc(match.cmd)}</span>
                <span class="badge badge-amber">${esc(match.type)}</span>
              </div>
              <div class="detail-section">
                <span class="detail-label">1. Definition</span>
                <div class="detail-val">${esc(match.definition)}</div>
              </div>
              <div class="detail-section">
                <span class="detail-label">2. Function (How it works)</span>
                <div class="detail-val">${esc(match.function)}</div>
              </div>
              <div class="detail-section">
                <span class="detail-label">3. Purpose (When to use it)</span>
                <div class="detail-val">${esc(match.purpose)}</div>
              </div>
              <div class="detail-section" style="margin-top: 0.4rem;">
                <span class="detail-label">Syntax Example</span>
                <pre class="code">${esc(match.example)}</pre>
              </div>
            `;
          } else {
            existingCard.innerHTML = `
              <p style="color: var(--muted); margin: 0; text-align: center;">No command found matching "<code>${esc(state.lookupQuery)}</code>". Try typing commands like <code>def</code>, <code>translate</code>, <code>append</code>, or <code>split</code>.</p>
            `;
          }
        }
      });
    }

    panel.querySelectorAll(".quick-chip").forEach(chip => {
      chip.addEventListener("click", () => {
        state.lookupQuery = chip.dataset.cmd;
        render();
      });
    });
  } 
  else if (state.tab === "glossary") panel.innerHTML = renderGlossary();
  else if (state.tab === "library") panel.innerHTML = renderLibrary();
  else if (state.tab === "core5") panel.innerHTML = renderCoreFive();
  else if (state.tab === "quiz") panel.innerHTML = renderQuiz();
  else if (state.tab === "practice") panel.innerHTML = renderPractice();
}

render();
</script>
</body>
</html>
